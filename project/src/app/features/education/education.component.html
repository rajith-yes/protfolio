<section id="education" class="section-padding bg-main">
  <div class="container">
    <app-section-header
      badge="Academic Background"
      title="Education &amp; Languages"
      subtitle="Academic qualifications and language proficiency.">
    </app-section-header>

    <div class="row g-4 justify-content-center">
      <!-- Education Timeline Cards -->
      <div class="col-lg-8">
        <div class="d-flex flex-column gap-4">
          <div class="glass-card p-4 rounded-4 border-slate" *ngFor="let edu of educationList(); let i = index" [appScrollReveal]="'fade-up'" [delay]="i * 100">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-2">
              <div class="d-flex align-items-center gap-3">
                <div class="edu-icon-box rounded-3 d-flex align-items-center justify-content-center">
                  <i class="bi bi-mortarboard-fill text-cyan fs-4"></i>
                </div>
                <div>
                  <h3 class="fs-5 fw-bold text-white mb-0">{{ edu.degree }}</h3>
                  <div class="text-cyan small fw-medium">{{ edu.field }}</div>
                </div>
              </div>
              <span class="badge bg-slate-800 text-cyan border border-slate-700 px-3 py-2 rounded-3 align-self-start align-self-sm-center">
                {{ edu.year }}
              </span>
            </div>

            <div class="ps-sm-5 ms-sm-2">
              <p class="text-slate-300 mb-1 fw-medium">{{ edu.institution }}</p>
              <span *ngIf="edu.note" class="badge bg-cyan-subtle text-cyan px-2 py-1 small">
                {{ edu.note }}
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Languages Sidebar Card -->
      <div class="col-lg-4" appScrollReveal="fade-up" [delay]="200">
        <div class="glass-card p-4 rounded-4 border-slate h-100">
          <div class="d-flex align-items-center gap-2 mb-3 pb-2 border-bottom border-slate-700">
            <i class="bi bi-translate text-cyan fs-4"></i>
            <h3 class="fs-5 fw-bold text-white mb-0">Languages</h3>
          </div>

          <div class="d-flex flex-column gap-3">
            <div class="p-3 bg-slate-900 rounded-3 border border-slate-700 d-flex align-items-center justify-content-between" *ngFor="let lang of languages">
              <div>
                <div class="fw-bold text-white">{{ lang.language }}</div>
                <div class="text-cyan small">{{ lang.proficiency }}</div>
              </div>
              <i class="bi bi-check-circle-fill text-cyan"></i>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
