<section id="achievements" class="section-padding bg-main">
  <div class="container">
    <app-section-header
      badge="Key Achievements"
      title="Quantifiable Impact &amp; Engineering Metrics"
      subtitle="Proven results delivered through Angular architecture, optimization, and testing practices.">
    </app-section-header>

    <div class="row g-4">
      <div class="col-sm-6 col-lg-4" *ngFor="let item of achievements(); let i = index" [appScrollReveal]="'fade-up'" [delay]="i * 80">
        <div class="glass-card p-4 text-center h-100 rounded-4 metric-card border-slate">
          <div class="metric-icon-box mx-auto mb-3 rounded-circle d-flex align-items-center justify-content-center">
            <i class="bi {{ item.icon }} text-cyan fs-4"></i>
          </div>

          <div class="metric-value display-5 fw-bold text-gradient mb-1">
            {{ item.metric }}
          </div>

          <h3 class="fs-5 fw-bold text-white mb-2">
            {{ item.label }}
          </h3>

          <p class="text-slate-400 small mb-0">
            {{ item.description }}
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
